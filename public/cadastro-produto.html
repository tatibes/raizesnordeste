<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Produto - Raízes do Nordeste</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f9f6f0;
      color: #333;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background-color: #c0392b;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .nav-links {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .nav-links a {
      color: #c0392b;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #962d22;
      text-decoration: underline;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #444;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 5px;
      border: 1px solid #ccc;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #c0392b;
      outline: none;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #c0392b;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn:hover {
      background-color: #962d22;
    }

    .alert {
      padding: 15px;
      border-radius: 5px;
      margin-bottom: 20px;
      font-weight: bold;
      display: none;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌵 Raízes do Nordeste</h1>
      <p>Painel Administrativo - Cadastro de Produtos</p>
    </header>

    <div class="nav-links">
      <a href="cardapio.html">⬅ Voltar ao Cardápio</a>
      <a href="painel-pedidos.html">Ir ao Painel de Pedidos ➡</a>
    </div>

    <div class="card">
      <div id="alertSuccess" class="alert alert-success">✅ Produto cadastrado com sucesso!</div>
      <div id="alertError" class="alert alert-danger">❌ Erro ao cadastrar produto. Tente novamente.</div>

      <form id="formCadastro" onsubmit="salvarProduto(event)">
        <div class="form-group">
          <label for="nome">Nome do Produto *</label>
          <input type="text" id="nome" class="form-control" placeholder="Ex: Carne de Sol Especial" required>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição / Ingredientes</label>
          <textarea id="descricao" class="form-control" placeholder="Descreva os ingredientes e apresentação do prato..."></textarea>
        </div>

        <div class="form-group">
          <label for="categoria">Categoria *</label>
          <select id="categoria" class="form-control" required>
            <option value="">Selecione uma categoria...</option>
            <option value="Pratos Principais">Pratos Principais</option>
            <option value="Entradas">Entradas</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Sobremesas">Sobremesas</option>
          </select>
        </div>

        <div class="form-group">
          <label for="precoBase">Preço Base (R$) *</label>
          <input type="number" id="precoBase" class="form-control" placeholder="0.00" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
          <label for="selectUnidade">Disponível na Unidade *</label>
          <select id="selectUnidade" class="form-control" required>
            <option value="">A carregar unidades...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="quantidadeEstoque">Quantidade Inicial em Estoque *</label>
          <input type="number" id="quantidadeEstoque" class="form-control" value="100" min="0" required>
        </div>

        <button type="submit" class="btn">Cadastrar Produto</button>
      </form>
    </div>
  </div>

  <script>
    const API_URL = ''; // Usar caminhos relativos

    async function carregarUnidades() {
      const select = document.getElementById('selectUnidade');
      try {
        const response = await fetch(`${API_URL}/unidades`);
        if (!response.ok) throw new Error('Erro ao buscar unidades.');
        const unidades = await response.json();

        select.innerHTML = '<option value="">Selecione uma unidade...</option>';
        unidades.forEach(unidade => {
          const option = document.createElement('option');
          option.value = unidade.id;
          option.textContent = unidade.nome;
          select.appendChild(option);
        });
      } catch (error) {
        console.error(error);
        select.innerHTML = '<option value="">Erro ao carregar unidades</option>';
      }
    }

    async function salvarProduto(event) {
      event.preventDefault();

      const alertSuccess = document.getElementById('alertSuccess');
      const alertError = document.getElementById('alertError');
      alertSuccess.style.display = 'none';
      alertError.style.display = 'none';

      const nome = document.getElementById('nome').value;
      const descricao = document.getElementById('descricao').value;
      const categoria = document.getElementById('categoria').value;
      const precoBase = document.getElementById('precoBase').value;
      const unidadeId = document.getElementById('selectUnidade').value;
      const quantidadeEstoque = document.getElementById('quantidadeEstoque').value;

      try {
        const response = await fetch(`${API_URL}/produtos`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            nome,
            descricao,
            categoria,
            precoBase: parseFloat(precoBase),
            unidadeId: parseInt(unidadeId),
            quantidadeEstoque: parseInt(quantidadeEstoque)
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Erro na requisição');
        }

        alertSuccess.style.display = 'block';
        document.getElementById('formCadastro').reset();
        
        // Mantém a unidade selecionada para facilitar múltiplos cadastros
        document.getElementById('selectUnidade').value = unidadeId;
        
        // Ocultar alerta após 4 segundos
        setTimeout(() => { alertSuccess.style.display = 'none'; }, 4000);
      } catch (error) {
        console.error('Erro ao cadastrar produto:', error);
        alertError.textContent = `❌ ${error.message || 'Erro ao cadastrar produto.'}`;
        alertError.style.display = 'block';
      }
    }

    // Carrega unidades assim que a página é exibida
    window.addEventListener('DOMContentLoaded', carregarUnidades);
  </script>
</body>
</html>
